name: docker_publish

on:
  push:
    branches:
      - 'main'
      - "release/*"
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      skip-lint-test:
        description: "Skip tests"
        required: false
        type: boolean
        default: false

# Only pull request runs share a group, so a new push to a PR cancels its
# superseded run. Every other run gets its own group and is never cancelled
# or replaced, as without a concurrency block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint_test:
    uses: babylonlabs-io/.github/.github/workflows/reusable_go_lint_test.yml@902082b8e5c0a1fed7be6980fa6a1b77fc005c06 # v0.23.0
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs['skip-lint-test'] == true) }}
    with:
      go-version: '1.25'
      go-lint-version: 'v2.11.4'
      run-unit-tests: true
      run-integration-tests: false
      run-lint: true

  docker_pipeline:
    if: ${{ always() && (
          (github.event_name == 'workflow_dispatch' && inputs['skip-lint-test'] == true) ||
          needs.lint_test.result == 'success'
        )}}
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@902082b8e5c0a1fed7be6980fa6a1b77fc005c06 # v0.23.0
    needs: ["lint_test"]
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read        # REQUIRED by reusable workflow
      id-token: write       # REQUIRED for AWS OIDC
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
    with:
      publish: true
      push_to_dockerhub: true
      dockerfile: ./contrib/images/babylond/Dockerfile
      repoName: babylond
      docker_scan: true
      trivy_nofail: true

  docker_testnet_pipeline:
    if: ${{ always() && (
            startsWith(github.ref, 'refs/tags/') &&
            (
              (github.event_name == 'workflow_dispatch' && inputs['skip-lint-test'] == true) ||
              needs.lint_test.result == 'success'
            )
          ) }}
    uses: babylonlabs-io/.github/.github/workflows/reusable_docker_pipeline.yml@902082b8e5c0a1fed7be6980fa6a1b77fc005c06 # v0.23.0
    needs: ["lint_test"]
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read        # REQUIRED by reusable workflow
      id-token: write       # REQUIRED for AWS OIDC
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
    with:
      publish: true
      push_to_dockerhub: true
      dockerfile: ./contrib/images/babylond/Dockerfile
      repoName: babylond
      imageTag: ${{ github.ref_name }}-testnet  # Append '-testnet' to the tag name
      buildArgs: |
        BABYLON_BUILD_OPTIONS=testnet
      docker_scan: true
      trivy_nofail: true
      buildArtifactPrefix: "testnet-"
